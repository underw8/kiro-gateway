name: Docker Build and Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=kiro --cov-report=term

  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # BuildKit emulates arm64 for builds; `docker run` needs host binfmt.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Registry paths must be lowercase; github.repository may not be.
      - name: Resolve image repository
        run: echo "IMAGE_REPO=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Arm64 cannot be loaded into the local daemon, so PRs test amd64 only.
      - name: Build image for testing
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: kiro-gateway:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pushed untagged; tags move only after the tests below pass.
      - name: Build and push image by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_REPO }},push-by-digest=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Select image under test
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          IMAGE=${DIGEST:+$IMAGE_REPO@$DIGEST}
          echo "IMAGE=${IMAGE:-kiro-gateway:test}" >> "$GITHUB_ENV"

      - name: Test Docker image
        run: |
          # The local store holds one platform per digest: test arm64 first, then drop it.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            docker run --rm --platform linux/arm64 "$IMAGE" python main.py --version
            docker image rm "$IMAGE"
          fi
          docker run --rm "$IMAGE" sh -c "test -f /app/main.py && test -d /app/kiro && touch /app/test.tmp && rm /app/test.tmp"
          docker run --rm "$IMAGE" python main.py --version

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Report only; findings do not block publishing

      # Fork PRs get a read-only token and cannot upload SARIF.
      - name: Upload Trivy results to GitHub Security
        if: >-
          always() && hashFiles('trivy-results.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'docker-image'

      - name: Publish tags
        if: github.event_name != 'pull_request'
        run: |
          readarray -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE"
          echo "Published $IMAGE"
